<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballerina Survivor</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b15;color:#f2e8ca;font-family:Arial,sans-serif}
#unity-container{position:fixed;inset:0;width:100%;height:100%}
#unity-canvas{display:block;width:100%;height:100%;background:#080b15;outline:none}
#unity-loading-container{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#080b15;pointer-events:none}
.loading-title{font-size:clamp(24px,4vw,42px);font-weight:700;letter-spacing:.14em;line-height:1.22}
.loading-subtitle{color:#baa075;letter-spacing:.22em;font-size:12px;margin:22px 0}
#unity-progress-bar-empty{width:260px;height:3px;background:#253249;margin:18px auto}
#unity-progress-bar-full{width:0;height:100%;background:#baa075;transition:width .15s}
#unity-warning{display:none;position:absolute;top:12px;left:5%;right:5%;padding:12px;background:#351c34;border:1px solid #baa075;font-size:14px;z-index:3}
</style>
</head>
<body>
<div id="unity-container">
<canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Ballerina Survivor game"></canvas>
<div id="unity-loading-container"><div class="loading-title">BALLERINA<br>SURVIVOR</div><div class="loading-subtitle">THE STAGE IS ALMOST READY</div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
<div id="unity-warning" role="alert"></div>
</div>
<script>
// Unity 6000.6.5f1 default-template build tokens; original full-viewport presentation.
const canvas = document.querySelector('#unity-canvas');
const loading = document.querySelector('#unity-loading-container');
function unityShowBanner(message, type) {
  const banner = document.querySelector('#unity-warning');
  const entry = document.createElement('div');
  entry.textContent = message; banner.appendChild(entry); banner.style.display = 'block';
  if (type !== 'error') setTimeout(() => { entry.remove(); if (!banner.children.length) banner.style.display = 'none'; }, 5000);
}
const buildUrl = 'Build';
const config = {
  arguments: [],
  dataUrl: buildUrl + '/WebGL.data',
  frameworkUrl: buildUrl + '/WebGL.framework.js',
  codeUrl: buildUrl + '/WebGL.wasm',
  streamingAssetsUrl: 'StreamingAssets',
  fullscreenElementID: 'unity-container',
  companyName: "Family Ballet Studio",
  productName: "Ballerina Survivor",
  productVersion: "1.0",
  showBanner: unityShowBanner
};
const script = document.createElement('script');
script.src = buildUrl + '/WebGL.loader.js';
script.onload = () => {
  createUnityInstance(canvas, config, progress => {
    document.querySelector('#unity-progress-bar-full').style.width = (progress * 100) + '%';
  }).then(() => { loading.style.display = 'none'; canvas.focus(); })
    .catch(message => { loading.style.display = 'none'; unityShowBanner(String(message), 'error'); });
};
script.onerror = () => { loading.style.display = 'none'; unityShowBanner('The stage could not load. Please refresh to try again.', 'error'); };
document.body.appendChild(script);
</script>
</body>
</html>
